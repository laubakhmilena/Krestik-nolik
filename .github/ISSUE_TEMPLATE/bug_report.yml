## Что демонстрирует проект работодателю

- анализ требований и функций;
- создание QA-документации;
- написание воспроизводимых тест-кейсов;
- оформление дефектов;
- понимание Severity и Priority;
- UI-автоматизацию;
- работу с GitHub Actions;
- внимание к доступности и адаптивности.

## Ограничение анализа

Баг-репорты подготовлены по результатам статического анализа публичного кода. Перед статусом `Confirmed` дефект необходимо воспроизвести и приложить доказательства.
