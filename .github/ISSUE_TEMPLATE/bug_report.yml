# Крестики-нолики: Новая Эра — QA Portfolio

Учебный проект для портфолио специалиста по тестированию. Объект тестирования — браузерная игра «Крестики-нолики», реализованная на HTML, CSS и JavaScript.

Проект демонстрирует полный базовый набор QA-артефактов: тест-план, чек-лист, тест-кейсы, отчёты о дефектах, матрицу трассируемости и UI-автотесты на Playwright.

## Объект тестирования

В приложении реализованы:

- стартовый экран и навигация;
- игра двух пользователей на одном устройстве;
- игра против бота;
- три уровня сложности;
- проверка победы и ничьей;
- счётчик побед и ничьих;
- повторный запуск партии и сброс счёта;
- подтверждение выхода из незавершённой партии;
- несколько визуальных тем;
- сохранение темы в `localStorage`;
- русская и английская локализация;
- мобильная адаптация.

## QA-артефакты

| Артефакт | Назначение |
|---|---|
| [Тест-план](qa/TEST_PLAN.md) | Цели, объём, стратегия, риски и критерии завершения |
| [Чек-лист](qa/CHECKLIST.md) | Функциональные, UI, UX, accessibility и compatibility-проверки |
| [Тест-кейсы](qa/TEST_CASES.md) | Подробные сценарии с шагами и ожидаемыми результатами |
| [Баг-репорты](qa/BUG_REPORTS.md) | Кандидаты на дефекты по результатам статического анализа |
| [Матрица трассируемости](qa/TRACEABILITY_MATRIX.md) | Связь функций с проверками |
| [Отчёт](qa/TEST_SUMMARY.md) | Статус, покрытие и ограничения |
| [Шаблон дефекта](.github/ISSUE_TEMPLATE/bug_report.yml) | Форма для GitHub Issues |
| [UI-автотесты](tests/e2e/tic-tac-toe.spec.js) | Smoke и regression-набор Playwright |

## Техники тест-дизайна

- классы эквивалентности;
- граничные значения;
- таблицы принятия решений;
- переходы состояний;
- позитивные и негативные сценарии;
- исследовательское и риск-ориентированное тестирование;
- статический анализ;
- базовая accessibility-проверка.

## Автоматизированные проверки

UI-тесты проверяют загрузку, навигацию, режим с другом, чередование ходов, защиту занятой клетки, победу X, счётчики, рестарт, модальное окно, темы и экран сложности бота.

### Установка

Требуются Node.js 20+ и npm.

```bash
npm install
npx playwright install chromium
```

### Запуск

```bash
npm test
```

С видимым браузером:

```bash
npm run test:headed
```

HTML-отчёт:

```bash
npm run test:report
```

